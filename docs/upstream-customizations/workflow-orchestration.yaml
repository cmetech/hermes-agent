  - tests/tools/test_process_registry.py
  expected_commit_subject: 'fix(tools): verify managed process cleanup'
  upstream_candidate: true
  merge_guidance: Reconcile process identity, aggregate resource enforcement,
    process-tree termination, escalation, and wait/reap behavior before replaying
    the extraction.
  removal_condition: Remove when Hermes upstream exposes an equivalent generic managed-process-tree
    primitive used by ProcessRegistry.
  last_verified_upstream: aaf5691261f12601db845386d650dce1cdfa30f9
- id: plugin-agent-runner
  change_class: agent-core-generic
  owner: workflow-orchestration
  files:
  - agent/plugin_agent.py
  - agent/plugin_agent_worker.py
  - tools/registry.py
  - hermes_cli/plugins.py
  owned_symbols:
  - PluginAgentRunRequest
  - PluginAgentRunResult
  - PluginAgentRunner
  - _exchange_worker
  - ToolRegistry.scoped_names
  - PluginContext.agent
  tests:
  - tests/agent/test_plugin_agent.py
  - tests/tools/test_registry.py
  expected_commit_subject: 'feat(workflow): enforce per-node agent resources'
  upstream_candidate: true
  merge_guidance: Reconcile ToolRegistry generation/dispatch behavior, PluginContext
    facade construction, caller-driven worker cancellation/lifeline cleanup, and
    aggregate worker-tree resource limits before replaying this commit. Preserve
    the bounded per-call provider-attempt override, configurable cooperative/TERM/KILL
    termination policy, semantic-progress framing that excludes stderr, and the
    exact-digest one-shot approval grant, node-local hook/MCP inputs, and bounded
    synchronous inline-agent dispatcher so a workflow scheduler can remain the
    sole retry and lifecycle authority without granting a different action or
    exposing process-global resources.
  removal_condition: Remove when Hermes upstream exposes a trusted-plugin agent runner
    with isolated name-scoped registry execution.
  last_verified_upstream: aaf5691261f12601db845386d650dce1cdfa30f9
