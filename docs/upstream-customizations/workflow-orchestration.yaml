  expected_commit_subject: 'fix(workflow): isolate deterministic sessions'
  upstream_candidate: true
  merge_guidance: Preserve absence as a defined entitlement value. Current
    verified-bundle markers and complete v3.0.2 showcase identity tuples must
    derive deterministic without metadata upgrades or start-digest changes;
    ordinary trusted workflows with no showcase shape remain real. Accept an
    explicit real grant only when exact immutable identity corroborates the
    digest-verified requires_ai scenario, and record execution_integrity before
    runner selection on any mismatch. Classify command, prompt, loop, inline
    agents, and approval rejection rework centrally; route every consumer
    through the shared model-free runner under deterministic authority. Never
    read or write the real persistent-session registry under deterministic
    authority, so synthetic session identities cannot replace resumable real
    sessions.
  removal_condition: Remove when upstream provides equivalent immutable
    per-run AI authority with v3.0.2 recovery/adoption compatibility and
    fail-closed exact verified-scenario corroboration at every runner consumer.
  last_verified_upstream: aaf5691261f12601db845386d650dce1cdfa30f9
