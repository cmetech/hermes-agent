- id: workflow-run-execution-limits
  change_class: workflow-runtime
  owner: workflow-orchestration
  files:
  - plugins/workflow/executors/ai.py
  - plugins/workflow/executors/approval.py
  - plugins/workflow/executors/base.py
  - plugins/workflow/models.py
  - plugins/workflow/scheduler.py
  - plugins/workflow/schema.py
  - plugins/workflow/store.py
  owned_symbols:
  - RunExecutionLimits
  - RunExecutionLimits.resolve
  - NodeExecutionContext.execution_limits
  - RunScheduler._load_run_package
  - RunScheduler._run_execution_limits
  - RunScheduler._effective_retry_policy
  - RunScheduler._persist_result combined retry cap
  - NodeExecutionContext.max_provider_attempts remaining-budget grant
  - RunStore.claim_node max_run_workers composition
  - exact PluginAgentRunRequest execution-limit mapping
  - AgentNodeExecutor failed provider-attempt accounting
  - ApprovalExecutor failure, runner-exception, and authorization accounting
  - conservative_provider_retry_count
  - validated_provider_retry_count
  tests:
  - tests/plugins/workflow/test_ai_e2e.py
  - tests/plugins/workflow/test_ai_executor.py
  - tests/plugins/workflow/test_approval.py
  - tests/plugins/workflow/test_deadlines.py
  - tests/plugins/workflow/test_parallel_scheduler.py
  - tests/plugins/workflow/test_provider_failures.py
  - tests/plugins/workflow/test_retry.py
  - tests/plugins/workflow/test_schema.py
  - tests/plugins/workflow/test_workflow_showcase_desktop_e2e.py
  expected_commit_subject: 'fix(workflow): preserve approval authorization failures'
  upstream_candidate: true
  merge_guidance: Preserve one frozen execution-limit record resolved from the
    immutable run snapshot, with element-wise profile tightening at each claim
    and executor boundary. Keep scheduler pools, lifecycle clocks, coordinator
    thresholds, and admission quotas profile-global; retain the agent iteration
    hard cap of 90 rather than adding a run-level max_iterations field. Explicit
    node retry policies must remain min-capped by the run allowance. Failed AI
    and approval rework execution must preserve an exact valid provider-attempt
    count or conservatively consume the unknown granted remainder before workflow
    retry, including retryable agent-runner exceptions in both normal AI and
    approval rework. Catch PermissionError before OSError so pre-provider
    authorization refusals remain non-retryable and never receive a synthetic
    provider charge; never synthesize that charge for successful, paused, or
    cancelled results. Each later workflow attempt receives only the effective
    node/run allowance left after durable prior consumption, and an exhausted
    replay must fail before executor invocation. Accept reported provider retries
    only as non-boolean integers in the inclusive zero to grant-minus-one range.
  removal_condition: Remove when upstream enforces equivalent immutable per-run
    concurrency, worker, deadline, retry, resource-tree, and termination-grace
    ceilings without resizing or retiming shared coordinator infrastructure.
  last_verified_upstream: aaf5691261f12601db845386d650dce1cdfa30f9
