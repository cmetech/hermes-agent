  - _stale_run_error
  tests:
  - tests/hermes_cli/test_kanban_stale_run_callers.py
  - tests/hermes_cli/test_kanban_core_functionality.py
  expected_commit_subject: 'fix(kanban): handle a superseded run at every expected_run_id
    caller'
  upstream_candidate: true
  merge_guidance: 'UNION on merge. This is the CALLER half of kanban-mutation-preconditions
    and must not be separated from it: that entry changed a stale expected_run_id
    from "returns falsy" to "raises TaskMutationConflict", which silently made every
    caller''s `if not <mutation>:` branch unreachable for the stale case. Only the
    dashboard was updated at the time; the four CLI sites in hermes_cli/kanban.py
    (_cmd_heartbeat, _cmd_complete, _cmd_block, _cmd_schedule) printed a raw Python
    traceback and the three agent-tool sites in tools/kanban_tools.py fell through
    to their outer `except Exception`, losing the curated message and emitting an
    ERROR-level stack trace for a routine outcome.

    Two properties a merge must preserve. FIRST, the stale message stays DISTINCT
    from the pre-existing "unknown id or terminal state" wording -- telling those
    apart is the entire reason the exception exists (there the task is unusable; here
    the task is fine and this worker merely stopped owning it, which is recoverable
    by re-reading). SECOND, the agent-tool catch stays in the SPECIFIC handler, ahead
    of the catch-all, or the logger.exception noise returns.

    Note the deliberate asymmetry: heartbeat_worker does NOT raise. It is the only
    expected_run_id mutation that skips _with_expected_run/_check_mutation_precondition,
    resolving staleness with a conditional UPDATE and returning False, so its `if
    not ok` branch is still live. Its two TaskMutationConflict guards are therefore
    defensive and currently unreachable -- do not delete them as dead code; they are
    what stops a later conversion of heartbeat_worker from silently restoring the
    traceback. test_heartbeat_worker_returns_false_rather_than_raising pins the current
    behaviour so that conversion cannot happen unnoticed.

    tools/kanban_tools.py:309 (heartbeat_current_worker_from_env) is intentionally
    untouched -- it already degrades correctly to logger.debug.'
  removal_condition: Remove together with kanban-mutation-preconditions, or when upstream
    provides an equivalent conflict type whose callers it maintains itself.
  last_verified_upstream: 36cb5ae5530a75def7df3195e49b7a4aa2add482
