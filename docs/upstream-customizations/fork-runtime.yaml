  owned_invariants:
  - Electron owns one bounded connection attempt for each normalized connection/profile scope; renderer callers join it and never impose an earlier backend-start deadline.
  - Inspection is side-effect free, lifecycle events never renew a deadline, and typed terminal results release ownership for retry.
  - Explicit setup choice, update exclusion, and installation preparation pause remaining active dial budgets; ordinary phase progress cannot renew them. Preload replays scoped inspection and checks main responsiveness during preparation.
  - Remote ready descriptors re-enter native route health policy; omitted primary renderer identity never aliases explicit default.
  - Timed-out dial claims retire behind scoped process/SSH teardown before retry, and generation checks prevent late process creation or publication.
  - Profile and source activation preserve the previous usable context until the target backend and gateway are ready, then publish through existing generation and abort fences.
  - Performance entries stay local and contain only bounded operation, sequence, outcome, and duration data.
  tests:
  - apps/desktop/electron/connection-lifecycle.test.ts
  - apps/desktop/electron/primary-backend-startup.test.ts
  - apps/desktop/electron/backend-dial-claim.test.ts
  - apps/desktop/electron/backend-ready.test.ts
  - apps/desktop/electron/backend-health.test.ts
  - apps/desktop/electron/backend-connection-state.test.ts
  - apps/desktop/electron/power-resume-remote-revalidation.test.ts
  - apps/desktop/electron/registry-primary-profile-scope.test.ts
  - apps/desktop/src/lib/desktop-connection.test.ts
  - apps/desktop/src/lib/desktop-connection-performance.test.ts
  - apps/desktop/src/app/gateway/hooks/use-gateway-boot.test.tsx
  - apps/desktop/src/app/gateway/hooks/use-gateway-request.test.ts
  - apps/desktop/src/store/gateway.test.ts
  - apps/desktop/src/store/gateway-shared-remote.test.ts
  - apps/desktop/src/store/gateway-connection-lifecycle.test.ts
  - apps/desktop/src/store/profile.test.ts
  - apps/desktop/src/store/profile-switch-failure.test.ts
  - apps/desktop/src/store/profile-select-source.test.ts
  - apps/desktop/src/store/connections.test.ts
  - apps/desktop/src/api/plugins.test.ts
  - apps/desktop/src/lib/voice-playback.routing.test.ts
  - apps/desktop/src/plugin-socket-scope.test.ts
  - apps/desktop/src/store/workflow-marketplace-supervisor.test.ts
  expected_commit_subject: 'feat(desktop): define authoritative connection lifecycle'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. Preserve one Electron-owned, scope-keyed lifecycle for local,
    remote, initial, reconnect, profile, and source dials. Renderer consumers
    join the shared attempt and may cache only ready generation-fenced
    descriptors; they must not restore shorter 20/45-second backend-start
    timers. Keep compatibility bridge aliases delegated to the same authority,
    the strictly larger preload watchdog, typed credential-free errors, and the
    existing two-phase activation fences. Preserve the inner WebSocket and
    post-readiness operation bounds.
    Preparation remains owned by existing setup/install/update authorities,
    with remaining active time retained on resume. Remote ensures must retain
    dispatch health checks. Timeout retry must fence and drain the actual
    selected primary/pool and SSH scope before releasing its dial claim.
  removal_condition: >-
    Remove only when upstream provides one equivalent Electron-owned scoped
    lifecycle across every Desktop dial, including coalesced slow Windows cold
    starts, bounded genuine hangs, side-effect-free inspection, typed retries,
    scope/generation fencing, and two-phase profile/source switching. The
    focused slow-start, bounded-hang, switching, and platform-policy tests must
    pass without downstream behavior shims.
  last_verified_upstream: 29112bef099274229cadff79cdff7bf7b99c4b77

- id: desktop-skills-hub-suppression
  change_class: desktop-product-curation
  owner: downstream-desktop-runtime
  overlap_policy: any_owned_file
  files:
  - apps/desktop/src/app/skills/index.tsx
  - apps/desktop/src/app/skills/index.test.tsx
  owned_symbols:
  - SkillsView
  tests:
  - apps/desktop/src/app/skills/index.test.tsx
  expected_commit_subject: 'fix(desktop): hide Skills Hub in fork UI'
  upstream_candidate: false
  merge_guidance: >-
    RETAIN DOWNSTREAM BEHAVIOR on merge. SkillsView must expose installed skills,
    toolsets, and MCP configuration without mounting the Skills Hub picker,
    iframe, search, or discovery UI. This applies to the primary Capabilities
    page and every embedded SkillsView consumer, including Bot configuration.
    Preserve unrelated upstream skill management and detail improvements.
  removal_condition: >-
    Remove only if this fork deliberately re-enables Skills Hub in Desktop or
    upstream provides a generic Desktop product-curation gate that keeps the Hub
    disabled for every SkillsView consumer by default in this fork.
  last_verified_upstream: 29112bef099274229cadff79cdff7bf7b99c4b77
