  - apps/desktop/electron/native-notification-title.ts
  owned_symbols:
  - nativeNotificationTitle
  tests:
  - apps/desktop/electron/native-notification-title.test.ts
  expected_commit_subject: 'fix(desktop): brand native notification titles'
  upstream_candidate: false
  merge_guidance: >-
    UNION on merge. Native notification titles must use the active packaged app
    name and replace upstream product wording without altering notification
    routing, body text, or structured payload handling.
  removal_condition: >-
    Remove only when upstream notification dispatch accepts the active generic
    product identity at the same boundary.
  last_verified_upstream: 29112bef099274229cadff79cdff7bf7b99c4b77

- id: desktop-statusbar-default-and-locked-pills
  change_class: desktop-ux-contract
  owner: downstream-desktop-runtime
  overlap_policy: any_owned_file
  files:
  - apps/desktop/src/app/shell/statusbar-controls.tsx
  - apps/desktop/src/store/statusbar-prefs.ts
  owned_symbols:
  - $statusbarVisible
  - StatusbarControls
  - StatusbarItemView
  tests:
  - apps/desktop/src/app/shell/statusbar-visibility.test.tsx
  expected_commit_subject: 'feat(desktop): show the statusbar by default'
  upstream_candidate: true
  merge_guidance: >-
    CONVERGENT REVIEW REQUIRED. Upstream commit 120e465c9741d1fbf8f98dcf85ecb9df7cf09a05
    also makes the statusbar visible by default; if its behavior passes this
    fork's contract, classify that portion remove-as-upstream-equivalent rather
    than stacking it. Independently preserve locked version/update pills and
    flex shrink behavior so optional items cannot clip them off-screen.
  removal_condition: >-
    Remove the default override after upstream equivalence is verified. Keep
    the locked-pill delta until upstream guarantees those items remain visible
    at narrow widths.
  last_verified_upstream: 29112bef099274229cadff79cdff7bf7b99c4b77

- id: desktop-full-page-session-restore
  change_class: desktop-session-correctness
  owner: downstream-desktop-runtime
  overlap_policy: any_owned_file
  files:
  - apps/desktop/src/app/contrib/wiring.tsx
  - apps/desktop/src/store/session-states.ts
  owned_symbols:
  - ContribWiring
  - focusOpenSession
  tests:
  - apps/desktop/src/store/session-states.test.ts
  expected_commit_subject: 'fix(desktop): restore sessions from full-page routes'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. A cached primary session is considered on-screen only while
    its session route is visible; resuming it from a full-page route must
    navigate back instead of treating the cached selection as a completed focus.
  removal_condition: >-
    Remove when upstream distinguishes cached selection from visible primary
    session during resume/focus routing.
  last_verified_upstream: 29112bef099274229cadff79cdff7bf7b99c4b77

