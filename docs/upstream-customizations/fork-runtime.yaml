schema_version: 1
feature: fork-runtime
# Shared fork behaviors that are neither workflow orchestration nor generated
# brand overlays, but must survive upstream refactors on common runtime/UI files.
upstream_changes:
- id: profile-distribution-skill-ownership
  change_class: profile-integrity
  owner: downstream-profile-runtime
  overlap_policy: any_owned_file
  files:
  - agent/learning_graph.py
  - apps/desktop/src/app/skills/index.tsx
  - apps/desktop/src/app/starmap/node-context-menu.tsx
  - apps/desktop/src/app/starmap/star-map.tsx
  - apps/desktop/src/types/hermes.ts
  - hermes_cli/web_routers/skills.py
  - tools/skill_manager_tool.py
  - tools/skill_usage.py
  owned_symbols:
  - _profile_distribution_owned_roots
  - is_profile_distribution_skill
  - skill_ownership
  - _profile_distribution_write_guard
  - SkillsView
  - NodeContextMenu
  - SkillInfo
  tests:
  - tests/agent/test_learning_graph.py
  - tests/hermes_cli/test_web_server_skills_profiles.py
  - tests/tools/test_skill_manager_tool.py
  - tests/tools/test_skill_usage.py
  - apps/desktop/src/app/skills/index.test.tsx
  - apps/desktop/src/app/starmap/node-context-menu.test.tsx
  expected_commit_subject: 'fix(skills): enforce profile distribution ownership'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. Content installed and owned by a profile distribution is
    read-only to the agent curator and is labeled consistently by REST,
    Desktop, the learning graph, and mutation guards. Never infer ownership
    from name alone or let a profile-owned skill be archived, edited, or
    absorbed as agent-created content.
  removal_condition: >-
    Remove when upstream provides equivalent distribution-owned skill
    provenance and enforces it on every read and mutation surface.
  last_verified_upstream: 29112bef099274229cadff79cdff7bf7b99c4b77

- id: gateway-shutdown-diagnostic-watchdog-reaping
  change_class: runtime-reliability
  owner: downstream-gateway-reliability
  overlap_policy: any_owned_file
  files:
  - gateway/shutdown_forensics.py
  owned_symbols:
  - spawn_async_diagnostic
  tests:
  - tests/gateway/test_shutdown_forensics.py
  expected_commit_subject: 'fix(gateway): reap shutdown diagnostic watchdog'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. Detached shutdown diagnostics remain bounded without GNU
    timeout, and normal completion must terminate and wait for the watchdog and
    its timer so no sleeper is orphaned.
  removal_condition: >-
    Remove when upstream provides an equivalent portable bounded diagnostic
    subprocess with complete watchdog reaping.
  last_verified_upstream: 29112bef099274229cadff79cdff7bf7b99c4b77

- id: s6-supervise-permission-finalization
  change_class: runtime-reliability
  owner: downstream-gateway-reliability
  overlap_policy: any_owned_file
  files:
  - hermes_cli/service_manager.py
  owned_symbols:
  - _seed_supervise_skeleton
  tests:
  - tests/hermes_cli/test_service_manager.py
  expected_commit_subject: 'fix(service-manager): preserve setgid after ownership change'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. Apply ownership before final chmod on s6 directories and
    FIFOs because chown may clear setgid or mode bits required for group access.
  removal_condition: >-
    Remove when upstream creates the supervise skeleton with ownership-first,
    final-mode semantics and equivalent tests.
  last_verified_upstream: 29112bef099274229cadff79cdff7bf7b99c4b77

- id: branded-cli-and-profile-labels
  change_class: fork-brand-runtime
  owner: downstream-brand-runtime
  overlap_policy: any_owned_file
  files:
  - hermes_cli/_parser.py
  - hermes_cli/main.py
  - hermes_cli/profile_distribution.py
  - hermes_constants.py
  owned_symbols:
  - _brand_epilogue
  - _resolve_cli_prog
  - _resolve_help_product_name
  - _BrandedArgumentParser
  - check_hermes_requires
  - version_agent_label
  - product_cli_name
  - product_display_name
  tests:
  - tests/hermes_cli/test_branded_parser_prog.py
  - tests/hermes_cli/test_profile_distribution.py
  - tests/hermes_cli/test_profile_install_env_encoding.py
  - tests/hermes_cli/test_version_product_label.py
  expected_commit_subject: 'fix(cli): complete branded root help'
  upstream_candidate: false
  merge_guidance: >-
    UNION on merge. Root usage, epilogues, version labels, and profile
    distribution requirements must derive from the active brand while retaining
    upstream parser structure and commands. Literal upstream package names may
    remain only where they identify a compatibility protocol, not the product.
  removal_condition: >-
    Remove only if the fork no longer ships branded CLIs or upstream exposes a
    generic product-identity contract used by every parser/profile label.
  last_verified_upstream: 29112bef099274229cadff79cdff7bf7b99c4b77

- id: branded-native-notification-title
