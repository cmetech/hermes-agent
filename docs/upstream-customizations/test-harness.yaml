schema_version: 1
feature: test-harness
# Repairs to the shared Python test harness (scripts/run_tests.sh), which is
# upstream-owned. These are correctness fixes to the harness itself rather than
# downstream behaviour, so they are strong upstream candidates -- but until
# upstream takes them, a merge that rewrites the file silently restores a
# failure mode that costs ~101 test failures and is extremely hard to attribute.
upstream_changes:
- id: test-harness-bytecode-out-of-tree
  change_class: test-infrastructure
  owner: downstream-test-reliability
  files:
  - scripts/run_tests.sh
  owned_symbols:
  - PYCACHE_PREFIX
  - PYTHONPYCACHEPREFIX
  tests:
  - tests/plugins/workflow/test_portable_compatibility_e2e.py
  - tests/plugins/workflow/test_showcase_catalog.py
  - tests/plugins/workflow/test_catalog_api.py
  expected_commit_subject: "fix(tests): keep harness bytecode out of the showcase bundles"
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. Two cooperating lines; losing either brings the failure back.

    The harness pre-compiles bytecode with
    `compileall -- $(git ls-files '*.py')`. That glob matches every TRACKED .py,
    which includes the scripts inside workflow showcase bundles
    (plugins/workflow/showcases/packages/*/scripts/*.py). The resulting
    __pycache__ lands INSIDE a bundle whose safety contract rejects any
    non-UTF-8 file, so the entire bundle fails to load with
    "showcase safety contract rejects binary resource" chained from
    "'utf-8' codec can't decode byte 0xa7" (0xa7 is the CPython 3.11 .pyc magic).

    Measured blast radius: ~101 of 126 failures across all 8 slices on the first
    CI run this fork ever did on a development branch. It is also why a focused
    `run_tests.sh tests/plugins/workflow/` produced ~18 failures locally while
    the same tests passed serially -- the pollution is created by the harness,
    not by any test, which is why bisecting individual test files never
    reproduced it.

    (1) PYTHONPYCACHEPREFIX must be exported BEFORE the compileall call and also
    passed through the `env -i` block, or the runner subprocesses lose it and
    re-pollute. Deliberately NOT PYTHONDONTWRITEBYTECODE: that also fixes the
    pollution, but by making each of ~2000 subprocesses recompile from source,
    defeating the very pre-compile step the harness added for speed.

    (2) The showcase __pycache__ sweep makes an already-polluted checkout
    self-heal. Without it the redirect only prevents NEW writes, so an existing
    working tree keeps failing identically and the fix appears to do nothing.
    CI is unaffected either way (fresh checkout); this is purely for developers.

    If upstream ever narrows the compileall glob to exclude bundle content, (1)
    is still worth keeping as defence in depth -- any hand-run pytest or
    compileall re-pollutes otherwise.
  removal_condition: >-
    Remove when upstream either excludes showcase bundle scripts from the
    compileall glob and sets an out-of-tree cache prefix itself, or when the
    showcase safety contract stops treating generated bytecode as bundle content.
  last_verified_upstream: b7a05b6b6f509d14f708a2fe7b7c1d3559396ef6
