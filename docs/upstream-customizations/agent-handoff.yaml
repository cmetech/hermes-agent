  protocol_clarifications:
  - a peer endpoint is only hermes://peer/<configured-peer>/<profile>; it never
    carries a URL, host, port, credential, userinfo, query, or fragment
  - peer credentials are resolved lazily from the initiating profile; one peer
    entry currently supplies one key for its advertised profile routes
  - an authenticated wrong or unavailable destination profile is safely exposed
    as endpoint_unavailable rather than promising a profile-specific public code
  - authoritative convergence polls status by Run ID; events are optional only
  - interactive Workflow input is limited to advertised approval choices and
    durable once/deny responses; arbitrary remote questions remain deferred
  - a lost non-idempotent control response remains indeterminate and is never
    blindly replayed, while a lost submit response reconciles with the same key
  - a fully processed coordinator page advances across filtered future input
    waits, while a partial page never skips an unprocessed actionable run
  intentional_exclusions:
  - Bot Mode, Desktop chat migration, message_agent, and peer DM changes
  - durable Bot return delivery, generic channels, repository channels, and A2A
  - Windows CLI locking, relay retirement, and interactive CLI fallback
  adversarial_review:
    verdict: no_unresolved_stage_2_correctness_or_security_findings
    confirmed_and_remediated:
    - filtered paused rows could prevent the ordinary coordinator keyset cursor
      from reaching later runs; the raw-page cursor now advances only after all
      returned actionable rows were processed
    inherited_diagnostics:
    - whole-Workflow parallel load remains timing- and lifecycle-sensitive on
      macOS, while every failed or crashed file passes in isolation
ownership:
  handoff_service: hermes_cli/handoff
  workflow_consumer: plugins/workflow
  local_cli_serialization: tools/bot_relay.py
  model_tool_surface: unchanged
configuration:
  user_visible:
  - workflow companion sidecars may declare prompt-node assignments with a
    canonical hermes://local/<profile> or hermes://peer/<peer>/<profile>
    endpoint, interaction policy, deadline, and deadline action
  - operators inspect profile-local state with hermes handoff list, show,
    evidence, reconcile, cancel, respond, steer, and message
  credentials:
  - loopback Runs uses only the destination profile's API_SERVER_KEY through
    the existing API-server profile scope
  - no new user-facing environment variable or credential store is introduced
  - remote Runs resolves the configured peer key only from the initiating
    profile and never persists credentials or raw authorization material
  transport:
  - local Runs requires an enabled multiplexed loopback API server advertising
    durable keyed Runs; POSIX may use the bounded noninteractive CLI fallback
  - remote Runs uses the existing peer registry, redirect-safe direct HTTP,
    profile-prefixed Runs routes, and a stable bounded idempotency key
storage:
  handoff_database: ${HERMES_HOME}/handoffs.db
  workflow_database: ${HERMES_HOME}/workflows/admission.sqlite3
  destination_run_database: <destination-profile-home>/state.db
  destination_profile_homes:
    default: <default-hermes-home>
    named: <default-hermes-home>/profiles/<profile>
  cli_receipts: >-
    ${HERMES_HOME}/handoffs/<handoff_id>/ (transient until the terminal
    observation commits durably)
upstream_touchpoints:
- gateway/platforms/api_server.py native and profile-prefixed route mounting,
  profile secret scope, capabilities, and Runs routes
- gateway/platforms/api_server_runs.py durable keyed admission, status,
  interruption, and stop behavior
- gateway/platforms/api_server_run_idempotency.py profile-and-credential-scoped
  idempotency reservations
- hermes_cli/peers.py and hermes_cli/subcommands/peer.py configured peer
  resolution, authentication, redirect safety, and Runs command authorities
- hermes_cli/handoff/peer.py and hermes_cli/handoff/runs.py consumer-neutral
  peer channel and shared bounded Runs transport
- tools/bot_relay.py destination-profile cross-process turn lock
- hermes_cli/main.py top-level CLI registration
- plugins/workflow coordinator election, scheduler, store, sidecar schema,
  trust summary, dashboard projection, notification journal, and attention
rollback:
  procedure:
  - stop Workflow coordinator hosts before reverting so no new handoff advances
    begin during rollback
  - revert the Stage 2 commits before Stage 1 as dependency-ordered series,
    removing remote assignments only after remote waits have settled
  - revert the Stage 1 commits as one dependency-ordered series, removing the
    assignments language only after waiting_handoff runs have settled
  - preserve handoffs.db, Workflow evidence, and destination Run state until
    operators have reconciled every nonterminal handoff
  - ordinary unassigned prompt nodes and Bot Mode remain the fallback behavior;
    never reinterpret an admitted handoff as a Bot Chat send
  data_compatibility: Stage 1 and Stage 2 SQLite migrations are additive;
    rollback must not delete profile-local evidence, remote references, command
    journals, or receipts automatically
deferred_stages:
  stage_3: Bot Mode and Desktop migration plus durable return delivery
  stage_4: separately distributed GitLab+ICM plugin and channel registration
  stage_5: Windows destination lock, operational hardening, and retirement review
