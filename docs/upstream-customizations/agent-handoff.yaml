  protocol_clarifications:
  - legacy local names retain Bot Chat CLI compatibility; legacy bare-peer and
    peer/profile names retain direct Peer DM timing; canonical URI or directory
    endpoints opt into the durable controlled conversation path
  - one conversation handoff represents one bounded request/reply lifecycle;
    correlated follow-up creates a new keyed destination operation while
    retaining the canonical Bot Chat session
  - exact approval responses, follow-up, steer, stop, and interruption use the
    advertised Runs contract; arbitrary remote questions remain deferred
  - durable return rows and restart scans are authoritative; the in-process
    completion queue is only a fast path and transcript acknowledgement prevents
    duplicate wake turns after a crash
  - a closed, host-derived gateway or web binding is part of each Bot return
    route; only that initiating host may select, claim, or consume its delivery
  - classic CLI Bot Chat has no durable return host, so new friendly local
    sends retain background CLI delivery while canonical/directory handoffs and
    every correlated continuation fail closed without sending
  - Bot and Desktop Stage 3 creation does not expose a deadline; existing
    Workflow deadlines remain coordinator-owned and are re-proved by the remote
    Workflow E2E until the shared service gains a consumer-neutral deadline
    policy contract
  intentional_exclusions:
  - generic channel registration, GitLab+ICM, repository channels, and A2A
  - peer DM replacement, relay retirement, and durable legacy compatibility
    delivery
  - Windows CLI destination locking and any Stage 5 retirement decision
  adversarial_review:
    verdict: no_unresolved_stage_3_correctness_or_security_findings
    confirmed_and_remediated:
    - legacy peer/profile timing remains on direct Peer DM instead of blocking a
      bounded supervisor tick
    - return claims are bound to the initiating gateway or web host before claim
    - invalid directory and wake configuration fail closed
    - Desktop detail exposes only a bounded, forcibly redacted result preview
    - initiating gateway and TUI return recovery cross fresh process boundaries
    - classic CLI cannot create an undeliverable durable return or discard a
      handoff ID into an uncorrelated legacy send
    verification:
    - exact affected gate: 1371 passed, 0 failed, 5 platform-specific skips
    - real-boundary gate: 161 passed, 0 failed, 1 platform-specific skip
    - installed-wheel gate: 2 passed, 0 failed
    - return-race stress: 14 of 14 executions passed
    - Stage 3 Desktop gate: 66 passed, 0 failed; typecheck passed
    inherited_diagnostics:
    - whole-Workflow SQLite background-thread lifecycle remains load-sensitive
      on macOS; the Stage 3 supervisor shutdown regression and aggregate gate
      are clean
    - one unchanged Desktop group-round ordering assertion failed under a later
      full parallel diagnostic and passed immediately in isolation
