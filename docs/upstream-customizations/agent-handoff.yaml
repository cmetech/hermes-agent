upstream_changes:
- id: durable-agent-handoff-service
  change_class: capability-generic
  owner: downstream-agent-handoff
  overlap_policy: any_owned_file
  files:
  - hermes_cli/handoff/__init__.py
  - hermes_cli/handoff/cli.py
  - hermes_cli/handoff/local.py
  - hermes_cli/handoff/models.py
  - hermes_cli/handoff/service.py
  - hermes_cli/handoff/store.py
  - hermes_cli/main.py
  - tools/bot_relay.py
  owned_symbols:
  - HandoffEndpoint
  - HandoffSpec
  - HandoffStore
  - AgentHandoffService
  - LocalHermesChannel
  - cmd_handoff
  - build_handoff_parser
  owned_invariants:
  - one stable consumer key maps to one immutable handoff specification and conflicting reuse fails closed
  - the initiating profile owns the durable lifecycle ledger while the destination profile owns its Run and credentials
  - binding fixes one endpoint and mechanism before submission and uncertain admission reconciles without blind duplicate execution
  - cancellation records durable intent but terminal truth continues to follow the destination observation
  - evidence is bounded and redacted and never persists API keys authorization headers or raw secret-bearing failures
  - the CLI fallback is noninteractive receipt-based and destination-lock serialized on POSIX and unavailable on Windows
  tests:
  - tests/hermes_cli/handoff/test_models.py
  - tests/hermes_cli/handoff/test_store.py
  - tests/hermes_cli/handoff/test_service.py
  - tests/hermes_cli/handoff/test_local_runs.py
  - tests/hermes_cli/handoff/test_local_cli.py
  - tests/hermes_cli/test_handoff_cmd.py
  - tests/hermes_cli/test_peer_cmd.py
  - tests/tools/test_bot_turn_lock.py
  - tests/tools/test_bot_relay_windows_paths.py
  - tests/gateway/test_api_server_run_idempotency.py
  - tests/gateway/test_api_server_runs.py
  expected_commit_subject: 'feat(handoff): define local task contract'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. Preserve the consumer-neutral service and profile-local
    ledger while adapting to upstream API-server and CLI changes. Reuse the
    native/profile Runs routes and their idempotency store; never fork those
    authorities. Keep destination credentials inside the routed profile scope,
    persist submit intent before I/O, reconcile indeterminate outcomes, and
    keep the CLI fallback disabled on Windows until the destination lock has a
    real cross-process implementation. Rerun the handoff, Runs, peer, Bot-lock,
    and real two-profile suites after overlap.
  removal_condition: >-
    Remove when upstream provides an equivalent consumer-neutral, profile-local
    durable handoff lifecycle with immutable binding, keyed local Runs,
    convergent cancellation and reconciliation, bounded redacted evidence, and
    a safe noninteractive destination-serialized local fallback.
  last_verified_upstream: 29112bef099274229cadff79cdff7bf7b99c4b77

