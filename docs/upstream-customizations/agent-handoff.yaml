schema_version: 1
feature: agent-handoff
# Stage 1 is the bounded local-Workflow slice. The handoff service remains
# consumer-neutral; Workflow owns only its assignment and wait projection.
ownership:
  handoff_service: hermes_cli/handoff
  workflow_consumer: plugins/workflow
  local_cli_serialization: tools/bot_relay.py
  model_tool_surface: unchanged
configuration:
  user_visible:
  - workflow companion sidecars may declare prompt-node assignments with a
    canonical hermes://local/<profile> endpoint, interaction policy, deadline,
    and deadline action
  - operators inspect profile-local state with hermes handoff list, show,
    evidence, and reconcile
  credentials:
  - loopback Runs uses only the destination profile's API_SERVER_KEY through
    the existing API-server profile scope
  - no new user-facing environment variable or credential store is introduced
  transport:
  - local Runs requires an enabled multiplexed loopback API server advertising
    durable keyed Runs; POSIX may use the bounded noninteractive CLI fallback
storage:
  handoff_database: ${HERMES_HOME}/handoffs.db
  workflow_database: ${HERMES_HOME}/workflows/admission.sqlite3
  destination_run_database: <destination-profile-home>/state.db
  destination_profile_homes:
    default: <default-hermes-home>
    named: <default-hermes-home>/profiles/<profile>
  cli_receipts: ${HERMES_HOME}/handoffs/<handoff_id>/
upstream_touchpoints:
- gateway/platforms/api_server.py native and profile-prefixed route mounting,
  profile secret scope, capabilities, and Runs routes
- gateway/platforms/api_server_runs.py durable keyed admission, status,
  interruption, and stop behavior
- gateway/platforms/api_server_run_idempotency.py profile-and-credential-scoped
  idempotency reservations
- tools/bot_relay.py destination-profile cross-process turn lock
- hermes_cli/main.py top-level CLI registration
- plugins/workflow coordinator election, scheduler, store, sidecar schema,
  trust summary, dashboard projection, notification journal, and attention
rollback:
  procedure:
  - stop Workflow coordinator hosts before reverting so no new handoff advances
    begin during rollback
  - revert the Stage 1 commits as one dependency-ordered series, removing the
    assignments language only after waiting_handoff runs have settled
  - preserve handoffs.db, Workflow evidence, and destination Run state until
    operators have reconciled every nonterminal handoff
  - ordinary unassigned prompt nodes and Bot Mode remain the fallback behavior;
    never reinterpret an admitted handoff as a Bot Chat send
  data_compatibility: Stage 1 SQLite migrations are additive; rollback must not
    delete profile-local evidence or receipts automatically
deferred_stages:
  stage_2: remote hermes://peer routing, interaction, steer/follow-up, and stop
  stage_3: Bot Mode and Desktop migration plus durable return delivery
  stage_4: separately distributed GitLab+ICM plugin and channel registration
  stage_5: Windows destination lock, operational hardening, and retirement review
