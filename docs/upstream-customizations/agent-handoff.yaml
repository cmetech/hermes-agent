  owned_invariants:
  - one stable consumer key maps to one immutable handoff specification and conflicting reuse fails closed
  - the initiating profile owns the durable lifecycle ledger while the destination profile owns its Run and credentials
  - binding fixes one endpoint and mechanism before submission and uncertain admission reconciles without blind duplicate execution
  - cancellation records durable intent but terminal truth continues to follow the destination observation
  - evidence is bounded and redacted and never persists API keys authorization headers or raw secret-bearing failures
  - CLI prompt, output, and raw stderr spools are transient and removed once the corresponding safe durable fact commits
  - the CLI fallback is noninteractive receipt-based and destination-lock serialized on POSIX and unavailable on Windows
  - scheduler admission selects cancellations, expired deadlines, and oldest due observations before applying its bounded page
  - bounded local admission is process-singleflight so timed-out worker threads cannot accumulate while concurrent callers share one aggregate budget
  - each handoff failure notification has an exact durable identity and never coalesces unrelated handoffs
  - peer endpoints are strict registry references and never accept raw network or credential material
  - every remote Workflow admission uses one stable bounded idempotency key and reconciles ambiguity with the identical request
  - peer credentials resolve lazily from the initiating profile and are neither persisted nor forwarded across an unsafe redirect or ambient proxy
  - peer control intent is journaled before I/O and an ambiguous non-idempotent response is never replayed blindly
  tests:
  - tests/hermes_cli/handoff/test_models.py
  - tests/hermes_cli/handoff/test_store.py
  - tests/hermes_cli/handoff/test_service.py
  - tests/hermes_cli/handoff/test_local_runs.py
