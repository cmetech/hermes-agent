schema_version: 1
feature: agent-handoff
# Stages 1-3 provide local and authenticated peer Workflow handoffs plus
# durable Bot/Desktop conversations and returns. The handoff service remains
# consumer-neutral; each consumer owns only its projection and delivery edge.
