schema_version: 1
feature: plugin-configuration
# Generic host seams for descriptor-backed edge connectors. No connector id,
# endpoint, credential name, or brand-specific default belongs in these files.
upstream_changes:
- id: static-plugin-configuration-descriptors
  change_class: plugin-host-generic
  owner: downstream-edge-capability
  overlap_policy: any_owned_file
  files:
  - hermes_cli/plugin_configuration.py
  - hermes_cli/plugins.py
  - tests/hermes_cli/test_plugin_configuration.py
  owned_symbols:
  - FieldStorage
  - ValidationConstraints
  - VisibilityCondition
  - ReadinessContribution
  - PluginConfigurationField
  - SetupActionMetadata
  - PluginConfigurationDescriptor
  - load_plugin_configuration
  - project_plugin_configuration
  - PluginManifest
  - LoadedPlugin
  - PluginManager.static_plugin_inventory
  owned_invariants:
  - plugin configuration metadata is inert bounded JSON loaded without importing plugin code
  - malformed descriptors omit configuration surfaces without preventing plugin discovery
  - field ids, types, defaults, visibility, validation, readiness, platform projection, and setup-action metadata are bounded and fail closed
  - descriptors declare generic host behavior and never grant connector execution authority
  tests:
  - tests/hermes_cli/test_plugin_configuration.py
  expected_commit_subject: 'feat(plugins): expose static configuration descriptors'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. Preserve static, side-effect-free descriptor discovery:
    reading plugin.yaml/config.schema.json must never import the plugin. Keep
    schema bounds, duplicate-key rejection, regular-file/no-symlink checks,
    fixed-width regex validation, URL validation, exact structured-plugin
    identity, and platform filtering. Plugin discovery must remain available
    when a descriptor is invalid, but no invalid field or action may project.
    Do not add connector ids or vendor-specific defaults to this generic seam.
  removal_condition: >-
    Remove when upstream provides an equivalent bounded static plugin
    configuration descriptor with side-effect-free discovery, generic field and
    action projection, and the same fail-closed path/schema guarantees.
  last_verified_upstream: b7a05b6b6f509d14f708a2fe7b7c1d3559396ef6

- id: profile-plugin-configuration-and-setup-actions
  change_class: plugin-host-generic
  owner: downstream-edge-capability
  overlap_policy: any_owned_file
  files:
  - hermes_cli/plugin_configuration.py
  - hermes_cli/plugins.py
  - hermes_cli/main.py
  - hermes_cli/subcommands/tools.py
  - hermes_cli/tools_config.py
  - tests/hermes_cli/test_plugin_configuration_storage.py
  - tests/hermes_cli/test_plugin_setup_actions.py
  - tests/hermes_cli/test_plugins.py
  - tests/hermes_cli/test_tools_config.py
  owned_symbols:
  - PluginConfigurationError
  - PluginRuntimeConfiguration
  - SetupActionContext
  - PluginConfigurationService
  - _runtime_configuration_for_context
  - get_plugin_configuration_service
  - ConnectorCapabilitySnapshot
  - connector_capability_snapshot
  - PluginContext.configuration
  - PluginContext.register_setup_action
  - PluginManager.setup_action_registrations
  - plugin_configuration_command
  owned_invariants:
  - settings are profile-local config while secrets use profile-local secret storage and never enter config.yaml or public projections
  - runtime plugin access exposes only descriptor-declared resolved fields and distinguishes setting from secret access
  - setup actions are registered by loaded plugin code but admitted only through matching static action metadata
  - setup actions are bounded by concurrency, timeout, output, result, cancellation, profile ownership, and redaction contracts
  - readiness and configured-toolset snapshots are backend-authored, bounded, immutable for one operation, and connector-id agnostic
  - read-only configuration and readiness projections use the explicit profile config path and never bootstrap or mutate HERMES_HOME
  - CLI and tools configuration dispatch through the same service used by other host surfaces
  tests:
  - tests/hermes_cli/test_plugin_configuration_storage.py
  - tests/hermes_cli/test_plugin_setup_actions.py
  - tests/hermes_cli/test_plugins.py
  - tests/hermes_cli/test_tools_config.py
  expected_commit_subject: 'feat(plugins): configure profile connectors and setup actions'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. Retain one profile-scoped service as the authority for CLI,
    Desktop, workflow admission, and plugin runtime access. Never place secrets
    in config.yaml, callback arguments, logs, status output, or connector
    fingerprints. Keep static action declarations separate from runtime handler
    registration, preserve reload publication barriers, and fail closed on
    mismatched profiles, unknown ids, capacity exhaustion, callback failures,
    or malformed readiness values. Do not special-case a connector in generic
    production code.
  removal_condition: >-
    Remove when upstream ships equivalent profile-local plugin configuration,
    secret storage, bounded setup-action lifecycle, runtime access, readiness,
    and CLI projection through one connector-neutral service.
  last_verified_upstream: b7a05b6b6f509d14f708a2fe7b7c1d3559396ef6

- id: desktop-plugin-configuration-projection
  change_class: desktop-capability-generic
  owner: downstream-edge-capability
  overlap_policy: any_owned_file
  files:
