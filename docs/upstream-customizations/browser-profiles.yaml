schema_version: 1
feature: browser-profiles
# Persistent enrolled-browser profiles: let a corporate browser holding a live
# SSO/mTLS session reach the internal origins it explicitly lists, so the agent
# can read enterprise pages and complete enterprise FORMS by natural language.
#
# Design: docs/plans/2026-07-20-persistent-enrolled-browser-session-design.md
# Plan:   docs/superpowers/plans/2026-07-25-browser-session-manager.md
#
# Why this manifest exists: the workspace-level surface table and the
# otto-upstream-merge grep list live OUTSIDE any git repository (the workspace
# root is not a repo), so they do not travel with the branch and are invisible
# to a merge performed from another checkout. This ledger is in-repo, versioned,
# and machine-checkable via scripts/check_upstream_customizations.py.
