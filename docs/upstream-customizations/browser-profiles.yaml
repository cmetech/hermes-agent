  - tests/tools/test_browser_profile_trust_seam.py
  - tests/tools/test_browser_session_manager.py
  - tests/tools/test_browser_session_signin.py
  - tests/tools/test_browser_default_profile.py
  owned_symbols:
  - _session_trusts_url
  - _snapshot_blocked_url
  - _expression_targets_private_url
  - _current_page_private_url
  tests:
  - tests/tools/test_browser_profiles.py
  - tests/tools/test_browser_profile_trust_seam.py
  - tests/tools/test_browser_session_manager.py
  - tests/tools/test_browser_session_signin.py
  - tests/tools/test_browser_default_profile.py
  - tests/tools/test_browser_console_ssrf.py
  - tests/tools/test_browser_ssrf_local.py
  - tests/tools/test_browser_snapshot_ssrf.py
  - tests/tools/test_browser_get_images_ssrf.py
  - tests/tools/test_browser_private_page_action_guard.py
  - tests/tools/test_browser_hybrid_routing.py
  - tests/tools/test_browser_camofox_private_page_guard.py
  expected_commit_subject: 'feat(browser): origin-scoped SSRF trust seam for browser profiles'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge, never --theirs. Upstream's _is_local_backend() returns False
    for ANY CDP override, so _eval_ssrf_guard_active blocks every internal
    origin for an enrolled profile attached over CDP. The seam adds a
    fail-closed _session_trusts_url helper plus one guard line in each
    private-URL predicate, scoped to (session, origin) rather than exempting a
    whole session. The always-blocked cloud-metadata floor is evaluated FIRST at
    every site and is never trusted. _current_page_private_url also feeds
    _blocked_private_page_action, so click/type/press on a trusted internal page
    are covered transitively -- that path is what makes enterprise forms work,
    and silently losing it degrades forms without failing any build. The
    session_key parameter defaults to None, so the untouched upstream browser
    SSRF suite must stay green unedited; if it needs editing, the merge dropped
    or altered the seam. Mutable session state deliberately lives in
    tools/browser_session_registry.py to keep the shared-file footprint minimal.
    Guard sites covered: eval pre-scan and post-eval page recheck
    (_expression_targets_private_url / _current_page_private_url), browser_navigate's
    private-address block, and browser_snapshot + browser_vision via the shared
    _snapshot_blocked_url helper -- if upstream re-inlines either snapshot or
    vision comparison back to `not _is_safe_url(_current_url)`, the enrolled
    profile silently loses the ability to READ internal pages while still being
    able to navigate to them, which looks like a flaky page rather than a
    regression. browser.default_profile (browser_session_registry.default_profile_name)
    is what lets the AGENT's bare task_id inherit the profile; without it only
    scripted acquire() callers get enrolled access.
  removal_condition: >-
    Remove when upstream provides a first-class per-profile or per-origin trust
    model for private-network browser access (for example an allowlist attached
    to a CDP-attached session), making the local seam redundant.
  last_verified_upstream: b7a05b6b6f509d14f708a2fe7b7c1d3559396ef6
- id: enrolled-browser-launch-wiring
  change_class: capability-generic
  owner: downstream-edge-capability
  files:
  - tools/browser_tool.py
  - tools/browser_profiles.py
  - tools/browser_session_registry.py
  - tests/tools/test_browser_enrolled_launch.py
  - tests/tools/test_browser_profiles.py
  owned_symbols:
  - _session_cdp_url
  - _session_browser_profile
  - _session_uses_enrolled_browser
  - _default_profile_launchable
  - _forget_session_cdp_url
  - _reset_session_cdp_cache
  - default_profile_launchable
  - _enrolled_candidates
  tests:
  - tests/tools/test_browser_enrolled_launch.py
  - tests/tools/test_browser_profiles.py
  - tests/tools/test_browser_hybrid_routing.py
  - tests/tools/test_browser_cdp_override.py
  - tests/tools/test_browser_chromium_check.py
  - tests/tools/test_browser_ssrf_local.py
  expected_commit_subject: 'feat(browser): drive the real installed browser for enrolled profiles'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge, never --theirs. This is the LAUNCH half of the enrolled
    profile; browser-profile-ssrf-trust-seam is only the TRUST half. Before it,
    nothing in the repo called browser_session_manager.acquire(), so
    browser.default_profile granted a session internal-origin trust while it
    still drove agent-browser's bundled Chrome for Testing -- the guard opened
    the door and the wrong browser walked through. Losing this reintroduces
    exactly that state, and it presents as an mTLS or connectivity failure on
    internal sites rather than as a missing feature.

    Three pieces, and the ORDER between them is a correctness constraint, not a
    preference.

    (1) _enrolled_candidates() in browser_profiles.py lists Chrome BEFORE Edge on
    all three platforms and includes real Windows Chrome paths (Program Files,
    Program Files (x86), and LOCALAPPDATA for per-user installs). What must never
    be relaxed is the exclusion of agent-browser's bundled Chrome for Testing:
    it is a different binary, not merely a different profile, and it is the one
    browser that cannot present machine certificates. Adding it would silently
    reinstate the original bug. The order itself is a fleet observation (Chrome
    is policy-managed on the target fleet, confirmed 2026-07-26), so flipping it
    back is a config decision, not a regression -- the exclusion is not.

    (2) _session_cdp_url(session_key) in browser_tool.py is the wiring, and
    mirrors how _session_trusts_url was introduced: one delegating helper plus a
    call-site swap. It resolves the session's profile (explicit bind, else
    browser.default_profile) and, when enrolled, returns
    acquire(profile, session_key=...).cdp_url; otherwise it returns
    _get_cdp_override() unchanged, so BROWSER_CDP_URL / browser.cdp_url
    precedence and /browser connect are untouched. The single launch call site is
    _get_session_info, guarded by `"" if force_local else ...` so hybrid-routing
    sidecars keep their deliberately local Chromium -- matching the previous code,
    where the value was ignored whenever force_local was set.

    Two properties inside it are load-bearing and neither is enforced by types.
    MEMOIZATION per session_key is not an optimization: acquire() runs
    _run_daemon_hygiene(), which executes `close --all`, so calling it per tool
    invocation tears the browser down between navigate and click. A FAILED
    acquire must NOT be cached (a transient launch failure has to be able to
    recover) and must propagate: acquire() raises ProfileError rather than
    falling back to the unmanaged bundled browser, and preserving that is the
    entire point -- a silent fallback fails corporate mTLS and reads as a broken
    connection instead of a misconfigured profile.

    The Chromium fast-fail gate in _run_browser_command consults the PURE
    predicate _session_uses_enrolled_browser, never _session_cdp_url. That
    distinction matters: cleanup_browser routes its `close` through
    _run_browser_command, so acquiring there would launch a browser in order to
    close one.

    Unswapped call sites (_is_local_mode, _is_local_backend,
    _ensure_cdp_supervisor) stay correct because acquire() exports
    BROWSER_CDP_URL via _attach_cdp, so _get_cdp_override() already returns the
    enrolled endpoint by the time they run. That side effect is part of acquire's
    contract; if upstream churn makes it unreliable, swap those sites rather than
    duplicating the resolution.

    (3) check_browser_requirements() gains an early return for a launchable
    enrolled default profile, beside the existing _get_cdp_override() one. This
    must land only AFTER (2). On its own it advertises browser tools that then
    launch agent-browser with no Chromium and hang until the command timeout --
    the failure the comment above that Chromium check already warns about. It is
    scoped to "would actually work" (toggle on AND executable resolves), mirroring
    the Termux branch's rule against advertising a tool that fails on first use;
    the underlying predicate lives in browser_session_registry so the footprint in
    the churned file stays a thin fail-closed delegator.

    The untouched upstream browser SSRF and hybrid-routing suites must stay green
    UNEDITED. If either needs editing after a merge, the merge altered this seam.
  removal_condition: >-
    Remove when upstream can drive a user-supplied, already-installed browser
    binary with a persistent user-data-dir as a first-class session backend,
    making the local acquire()/CDP wiring redundant.
  last_verified_upstream: b7a05b6b6f509d14f708a2fe7b7c1d3559396ef6
- id: browser-profile-settings-surface
  change_class: capability-generic
  owner: downstream-edge-capability
  files:
  - apps/desktop/src/app/settings/constants.ts
  - apps/desktop/src/app/settings/helpers.test.ts
  owned_symbols:
  - SECTIONS
  - FIELD_LABELS
  - FIELD_DESCRIPTIONS
  tests:
  - apps/desktop/src/app/settings/helpers.test.ts
  expected_commit_subject: 'feat(desktop): expose enrolled-browser trusted origins in Settings'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. Adds two keys to the Safety section of SECTIONS
    (browser.default_profile, browser.profiles.enrolled.trusted_origins) plus
    their FIELD_LABELS and FIELD_DESCRIPTIONS copy. They sit beside the
    pre-existing browser.allow_private_urls / browser.auto_local_for_private_urls
    keys because they gate the same capability. No new component: config-field
    already renders type 'list', which inferFieldSchema derives from an array
    value. These are ADDITIVE array entries and object keys, so upstream
    reordering or extending either structure merges cleanly -- but a whole-file
    rewrite of constants.ts drops them with no conflict and no test failure other
    than the named test, which is why that test asserts both the SECTIONS
    membership and the copy lookups. The trusted_origins field only renders once
    the profile exists in config (sectionFieldEntries omits absent keys); this is
    intended, not a bug. The allowPrivateUrls description deliberately steers
    users toward per-origin trust instead of the blunt global switch -- keep that
    wording or the UI invites the less safe option.
  removal_condition: >-
    Remove alongside browser-profile-ssrf-trust-seam, or when a dedicated browser
    profiles panel replaces these Advanced keys (planned follow-up, deferred until
    the enrolled launcher is verified on a managed corporate machine).
  last_verified_upstream: b7a05b6b6f509d14f708a2fe7b7c1d3559396ef6
- id: enrolled-profile-seeding-and-toggle
  change_class: capability-generic
  owner: downstream-edge-capability
  files:
  - capabilities/ericsson.json
  - hermes_cli/capability_staging.py
  - apps/desktop/src/app/settings/enrolled-profile-field.tsx
  - apps/desktop/src/app/settings/enrolled-profile-field.test.tsx
  - apps/desktop/src/app/settings/config-field.tsx
  - apps/desktop/src/app/settings/constants.ts
  - tests/hermes_cli/test_brand_defaults_seed.py
  owned_symbols:
  - _capability_config_defaults
  - _flatten_defaults
  - _read_nested
  - _write_nested
  - seed_brand_defaults
  - EnrolledProfileField
  - ENROLLED_PROFILE_NAME
  tests:
  - tests/hermes_cli/test_brand_defaults_seed.py
  - apps/desktop/src/app/settings/enrolled-profile-field.test.tsx
  expected_commit_subject: 'feat(browser): seed the enrolled profile and make activating it one click'
  upstream_candidate: false
  merge_guidance: >-
    UNION on merge. Removes the runbook's manual YAML step: the enrolled profile
    and its trusted_origins are seeded into config.yaml on first run, from
    capabilities/ericsson.json `configDefaults`.

    Two properties are load-bearing and neither is enforced by the type system.

    (1) SEED-ONCE, NEVER OVERWRITE. seed_brand_defaults records seeded leaf paths
    in the .brand-defaults-seeded.json marker (the `config` key, additive --
    its absence reads as "nothing seeded yet", so BRAND_DEFAULTS_SCHEMA_VERSION
    stays 1) and skips any path already present in the config. trusted_origins
    governs private-network access: a user who deliberately trims it must not
    have entries restored on the next launch. Do NOT move this into
    seed_baked_capabilities, which re-applies managed content on a version bump
    -- right for MCP definitions, wrong for a security list.

    (2) browser.default_profile is seeded EMPTY -- present, but not activated.
    The distinction is load-bearing in both directions and v4.2.0 got it wrong.

    It must not be seeded to "enrolled": that would route every unbound agent
    browsing session through the corporate profile, so arbitrary external pages
    would share a browser identity with live SSO cookies. Empty is what keeps it
    inert -- default_profile_name() returns `name or None`.

    But it must not be OMITTED either, which is what v4.2.0 shipped.
    sectionFieldEntries renders a key only when the served schema declares it OR
    the config already holds a value, and browser.default_profile is in neither:
    it is absent from DEFAULT_CONFIG, so absent from CONFIG_SCHEMA. Omitting it
    meant the activation switch never rendered at all, leaving the feature
    enable-able only by the hand-editing it existed to remove.

    So the invariant is "present and empty", not "absent". Two tests pin it --
    one on the seeder, one on sectionFieldEntries -- and both must survive.

    The toggle cannot be a plain `type: 'boolean'` schema entry:
    browser.default_profile holds a profile NAME, so the generic Switch branch
    would write `true` and default_profile_name() would look up a profile called
    "True" -- failing closed, but silently and for the wrong reason. Hence
    EnrolledProfileField, dispatched from config-field.tsx by schemaKey exactly
    as fallback_providers already is. Off writes an empty string, which is what
    `name or None` reads as no profile; writing `false` or deleting nothing would
    leave the profile active.

    A test reads the SHIPPED capabilities/ericsson.json rather than a fixture, so
    a typo there cannot leave every install unseeded while the suite stays green.
    Two origins, not three: the matcher treats *.ericsson.com as any strict
    subdomain, so *.internal.ericsson.com would be redundant.

    Known scope limit, accepted: the manifest is vendored on `base`, so a future
    NON-Ericsson brand built from base would also be seeded these origins. The
    gate for that is the descriptor's existing capabilitySets field.
  removal_condition: >-
    Remove when the enrolled browser profile is configured through a dedicated
    Settings panel that writes the profile directly, making first-run seeding of
    config.yaml unnecessary.
  last_verified_upstream: b7a05b6b6f509d14f708a2fe7b7c1d3559396ef6
