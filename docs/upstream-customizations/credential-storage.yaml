schema_version: 1
feature: credential-storage
# Security boundary for plugin-secret migration, helper-process isolation, and
# fail-closed credential publication on POSIX and Windows.
upstream_changes:
- id: plugin-secret-authority-and-tiering
  change_class: credential-security
  owner: downstream-security
  overlap_policy: any_owned_file
  files:
  - hermes_cli/env_loader.py
  - hermes_cli/plugin_configuration.py
  - hermes_cli/secret_authority.py
  - hermes_cli/secret_keystore.py
  owned_symbols:
  - SecretAuthority
  - AuthorityRegistry
  - encode_authority_registry
  - load_authority_registry
  - OSKeystore
  - FileKeystore
  - get_authority
  - resolve_secret
  tests:
  - tests/hermes_cli/test_env_loader.py
  - tests/hermes_cli/test_plugin_configuration_storage.py
  - tests/hermes_cli/test_secret_authority.py
  - tests/hermes_cli/test_secret_keystore.py
  expected_commit_subject: 'feat: add AES-GCM encrypted file backend for plugin secrets'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. Preserve profile-scoped authority, encrypted file storage,
    bounded OS-keystore probing, serialized mutations, durable revocation, and
    external-source precedence. Reads for absent secrets and configured modes
    remain non-mutating; failures never silently select a less-private tier.
  removal_condition: >-
    Remove when upstream provides an equivalent profile-scoped authority
    registry and OS/encrypted-file tier lifecycle with the same failure semantics.
  last_verified_upstream: 36cb5ae5530a75def7df3195e49b7a4aa2add482

- id: plugin-secret-migration-and-process-isolation
  change_class: credential-security
  owner: downstream-security
  overlap_policy: any_owned_file
  files:
  - agent/secret_sources/bitwarden.py
  - agent/secret_sources/command.py
  - hermes_cli/env_loader.py
  - hermes_cli/main.py
  - hermes_cli/plugin_secret_keys.py
  - hermes_cli/secrets_migrate.py
  owned_symbols:
  - is_plugin_secret_key
  - without_plugin_secret_keys
  - find_legacy_secrets
  - migrate_secrets
  - _handle_secrets_migrate
  - _scrub_plugin_secrets_from_process_env
  tests:
  - tests/hermes_cli/test_env_loader.py
  - tests/hermes_cli/test_secrets_migrate.py
  - tests/test_bitwarden_secrets.py
  - tests/test_command_secret_source.py
  expected_commit_subject: "feat: add 'hermes secrets migrate' to move plugin PATs out of .env"
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. Plugin credentials migrate from legacy dotenv storage into
    profile-local secret authority and are scrubbed from the long-lived process
    environment before external secret helpers run. Dry-run must not mutate;
    failed migration must not delete the source value.
  removal_condition: >-
    Remove when upstream supplies equivalent profile-local migration and proves
    plugin secrets cannot leak to helper subprocess environments.
  last_verified_upstream: 36cb5ae5530a75def7df3195e49b7a4aa2add482

- id: atomic-private-credential-publication
  change_class: credential-security
  owner: downstream-security
  overlap_policy: any_owned_file
  files:
  - hermes_cli/config.py
  - hermes_cli/container_storage.py
  - hermes_cli/env_loader.py
  - hermes_cli/security_audit_startup.py
  - hermes_cli/secret_authority.py
  - hermes_cli/secret_keystore.py
  - hermes_cli/secrets_repair.py
  - hermes_cli/windows_permissions.py
  owned_symbols:
  - WindowsAclError
  - WindowsAclInspection
  - open_private_directory
  - restrict_file_to_current_user
  - restrict_directory_to_current_user
  - inspect_file_acl
  - FileKeystore
  - inspect_mount_persistence
  - _container_no_volume_mount
  tests:
  - tests/hermes_cli/test_config.py
  - tests/hermes_cli/test_container_storage.py
  - tests/hermes_cli/test_env_loader.py
  - tests/hermes_cli/test_secret_keystore.py
  - tests/hermes_cli/test_secrets_repair.py
  - tests/hermes_cli/test_security_audit_startup.py
  - tests/hermes_cli/test_windows_permissions.py
  expected_commit_subject: 'fix: enforce credential ACLs after replacement'
  upstream_candidate: true
  merge_guidance: >-
    UNION on merge. Credential writes must publish atomically in the same
    directory and verify private ownership/ACLs after replacement. Windows
    operations remain handle-relative, reject reparses or identity swaps, use
    native same-directory rename, and fail closed when ACL inspection is
    unavailable or unstable. Container persistence must be proven or explicitly
    acknowledged before a new durable credential store is initialized.
  removal_condition: >-
    Remove only when upstream provides equivalent atomic publication and
    post-replacement POSIX/Windows privacy guarantees at every credential writer.
  last_verified_upstream: 36cb5ae5530a75def7df3195e49b7a4aa2add482
