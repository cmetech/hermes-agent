name: my-tickets-summary
description: Bounded read-only summary of unresolved Jira tickets assigned to the current user
tags: [ericsson, jira]
requires: [ericsson-jira]
nodes:
  - id: fetch-tickets
    prompt: >
      Use jira_my_tickets with max_results 25. Return every bounded issue in
      priority order with exact key, summary, status, priority, GitLab links,
      warnings, and an explicit status. A Jira failure is not an empty workload.
    allowed_tools: [jira_my_tickets]
    output_format:
      type: object
      additionalProperties: false
      required: [tickets, status, warnings]
      properties:
        tickets:
          type: array
          maxItems: 25
          items: {type: object}
        status: {type: string, enum: [success, zero_ticket, failed, permission, incomplete]}
        warnings: {type: array, maxItems: 100, items: {type: string, maxLength: 4096}}

  - id: summarize-tickets
    depends_on: [fetch-tickets]
    prompt: >
      Summarize the exact bounded tickets from $fetch-tickets.output.tickets
      while preserving upstream status $fetch-tickets.output.status and warnings
      $fetch-tickets.output.warnings; group successful tickets by priority, one
      line per key with summary, status, and GitLab links, then add at most three
      suggested-focus bullets. For failure or incomplete status, report that
      status and do not claim an empty workload.
    allowed_tools: []
    output_format:
      type: object
      additionalProperties: false
      required: [summary, status, warnings]
      properties:
        summary: {type: string, maxLength: 32768}
        status: {type: string}
        warnings: {type: array, maxItems: 100, items: {type: string, maxLength: 4096}}
