name: ericsson-gitlab
version: 1.0.0
description: "Bounded Ericsson GitLab reads and approval-gated writes."
author: Ericsson (cmetech)
kind: standalone
config_schema: config.schema.json
provides_tools:
  - gitlab_resolve_project
  - gitlab_list_group_projects
  - gitlab_list_commits
  - gitlab_read_commit
  - gitlab_list_commit_comments
  - gitlab_list_commit_discussions
  - gitlab_list_merge_requests
  - gitlab_list_merge_request_commits
  - gitlab_list_merge_request_discussions
  - gitlab_list_repository_tree
  - gitlab_read_file
  - gitlab_read_merge_request
  - gitlab_list_pipelines
  - gitlab_inspect_ci
  - gitlab_job_log
  - gitlab_retry_job
  - gitlab_play_job
  - gitlab_retry_pipeline
  - gitlab_create_branch
  - gitlab_commit_changes
  - gitlab_create_merge_request
  - gitlab_create_mr_note
  - gitlab_reply_to_discussion
  - gitlab_resolve_discussion
  - gitlab_merge_request_approvals
  - gitlab_approve_merge_request
  - gitlab_merge_merge_request
  - gitlab_update_merge_request
provides_hooks:
  - pre_tool_call
