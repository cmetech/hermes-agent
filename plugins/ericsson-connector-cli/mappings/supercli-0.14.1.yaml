schema_version: ericsson.supercli-migration/v1
source:
  product: SuperCLI
  version: 0.14.1
  commit: 6645cd0bb56cc54aa4f1d49095490832c9528dbb
  binary_sha256: 72ce9d9ad14b451b53a7f0f06786d75336a302562a8ed6d0dbafc2cb7657cc6a
  inventory_sha256: 2c09aab7b8a84a3fc6cff2e98b8cfd40e37290fd6c05ca1ac212584cf548664c
  evidence:
    - SUPER-CLI-ARCHITECTURE.md
    - PLUGIN-GAP-ANALYSIS.md
    - out/func-strings.txt

_templates:
  equivalent_read: &equivalent_read
    disposition: equivalent
    replacement: null
    operation: null
    flag_mapping:
      - source: Pinned evidence asserts the bare command only.
        replacement: Use the bounded operands and options shown in the replacement.
    output_difference: The replacement returns bounded normalized connector data rather than a raw vendor response.
    write_behavior: Read-only; dry-run, confirmation, and ambiguous-write handling do not apply.
    earliest_wave: Wave 4B
    rationale: The bounded replacement provides the same read outcome.
    evidence_ref: out/func-strings.txt
  renamed_read: &renamed_read
    disposition: renamed
    replacement: null
    operation: null
    flag_mapping:
      - source: Pinned evidence asserts the bare command only.
        replacement: Use the bounded operands and options shown in the replacement; do not infer source flags.
    output_difference: The replacement returns bounded normalized connector data rather than a raw vendor response.
    write_behavior: Read-only; dry-run, confirmation, and ambiguous-write handling do not apply.
    earliest_wave: Wave 4B
    rationale: The read outcome is supported under a curated command name.
    evidence_ref: out/func-strings.txt
  safer_read: &safer_read
    disposition: safer-different
    replacement: null
    operation: null
    flag_mapping:
      - source: Source --url, credential, --raw, and --no-throttle escape hatches, if present in a script.
        replacement: No argv translation; use active-profile configuration and bounded output.
    output_difference: The replacement is bounded and normalized and never returns an arbitrary raw vendor payload.
    write_behavior: Read-only; dry-run, confirmation, and ambiguous-write handling do not apply.
    earliest_wave: Wave 4B
    rationale: The user outcome is available with deliberate profile and output safety differences.
    evidence_ref: SUPER-CLI-ARCHITECTURE.md sections 4, 5, and 7
  safer_write: &safer_write
    disposition: safer-different
    replacement: null
    operation: null
    flag_mapping:
      - source: Source mutation operands evidenced by the command family.
        replacement: Use the bounded replacement operands and file inputs shown.
      - source: Source --url, credential, --raw, and --no-throttle escape hatches, if present in a script.
        replacement: No argv translation; use active-profile configuration and bounded output.
      - source: Mutation intent.
        replacement: Supply exactly one of --dry-run and --confirm.
    output_difference: The replacement returns a bounded normalized preview/result and never an arbitrary raw vendor payload.
    write_behavior: Every write requires exactly one of --dry-run and --confirm; confirmed ambiguous outcomes return write_ambiguous and are never retried.
    earliest_wave: Wave 4B
    rationale: The mutation is supported with stronger input, authority, and ambiguity controls.
    evidence_ref: SUPER-CLI-ARCHITECTURE.md sections 7.4 and 7.5; PLUGIN-GAP-ANALYSIS.md section 2
  gap: &gap
    disposition: not-yet-supported
    replacement: null
    operation: null
    flag_mapping: []
    output_difference: No Ericsson connector CLI result is available for this source command.
    write_behavior: No direct execution is exposed; no mutation authority is granted.
    earliest_wave: Unscheduled
    rationale: The current bounded connector contract does not expose this operation.
    evidence_ref: out/func-strings.txt
  excluded: &excluded
    disposition: no-equivalent
    replacement: null
    operation: null
    flag_mapping: []
    output_difference: No Ericsson connector CLI result is available for this deliberately excluded operation.
    write_behavior: No direct execution is exposed; no mutation authority is granted.
    earliest_wave: No port planned
    rationale: The operation is outside the approved bounded connector contract.
    evidence_ref: out/func-strings.txt

rows:
  # Jira — 24 exact source commands.
  - <<: *gap
    service: jira
    source_command: super-cli jira board list
    rationale: Jira Agile board enumeration is not exposed by the approved connector contract.
    evidence_ref: out/func-strings.txt:3099; SUPER-CLI-ARCHITECTURE.md section 6.3
  - <<: *safer_read
    service: jira
    source_command: super-cli jira component list
    replacement: '{brand} jira project get <project>'
    operation: jira_get_project
    rationale: Project lookup returns bounded issue types, components, and versions together.
    evidence_ref: out/func-strings.txt:3094; PLUGIN-GAP-ANALYSIS.md section 4
  - <<: *equivalent_read
    service: jira
    source_command: super-cli jira field list
    replacement: '{brand} jira field list'
    operation: jira_list_fields
    rationale: The bounded field inventory provides the same discovery outcome.
    evidence_ref: out/func-strings.txt:3110; PLUGIN-GAP-ANALYSIS.md section 4
  - <<: *safer_write
    service: jira
    source_command: super-cli jira issue assign
    replacement: '{brand} jira issue assign <key> <assignee> --dry-run|--confirm'
    operation: jira_assign_issue
    rationale: Assignment uses one bounded assignee and genuine one-shot write intent.
    evidence_ref: out/func-strings.txt:3049; SUPER-CLI-ARCHITECTURE.md section 6.3
  - <<: *safer_write
    service: jira
    source_command: super-cli jira issue comment add
    replacement: '{brand} jira issue comment <key> --body-file <path> --dry-run|--confirm'
    operation: jira_add_comment
    rationale: Comment text comes from a bounded file instead of process arguments and preserves ambiguous-write refusal.
    evidence_ref: out/func-strings.txt:3038; PLUGIN-GAP-ANALYSIS.md sections 2 and 3
  - <<: *gap
    service: jira
    source_command: super-cli jira issue comment list
    rationale: Issue lookup includes a bounded comment projection, but there is no standalone paginated comment-list contract.
    evidence_ref: out/func-strings.txt:3034; PLUGIN-GAP-ANALYSIS.md section 1.1
  - <<: *safer_write
    service: jira
    source_command: super-cli jira issue create
    replacement: '{brand} jira issue create <project> <issue-type> --summary <text> --dry-run|--confirm'
    operation: jira_create_issue
    rationale: Creation accepts a bounded issue shape and rejects arbitrary raw Jira field JSON.
    evidence_ref: out/func-strings.txt:3063; SUPER-CLI-ARCHITECTURE.md section 6.3
  - <<: *safer_write
    service: jira
    source_command: super-cli jira issue edit
    replacement: '{brand} jira issue update <key> --field <name=value> --dry-run|--confirm'
    operation: jira_update_fields
    rationale: Repeatable --field entries are bounded by an allowlist; arbitrary raw JSON mutation is not accepted.
    evidence_ref: out/func-strings.txt:3066; SUPER-CLI-ARCHITECTURE.md section 6.3
  - <<: *safer_write
    service: jira
    source_command: super-cli jira issue label add
    replacement: '{brand} jira issue label <key> add <label> --dry-run|--confirm'
    operation: jira_manage_labels
    rationale: Label addition is a bounded explicit operation with protected write authority.
    evidence_ref: out/func-strings.txt:3070; SUPER-CLI-ARCHITECTURE.md section 6.3
  - <<: *safer_write
    service: jira
    source_command: super-cli jira issue label remove
    replacement: '{brand} jira issue label <key> remove <label> --dry-run|--confirm'
    operation: jira_manage_labels
    rationale: Label removal is a bounded explicit operation with protected write authority.
    evidence_ref: out/func-strings.txt:3074; SUPER-CLI-ARCHITECTURE.md section 6.3
  - <<: *safer_write
    service: jira
    source_command: super-cli jira issue link
    replacement: '{brand} jira issue link <inward-key> <outward-key> <link-type> --dry-run|--confirm'
